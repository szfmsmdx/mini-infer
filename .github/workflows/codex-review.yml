name: Request Codex review

on:
  workflow_run:
    workflows: ["C++ correctness"]
    types: [completed]

permissions:
  pull-requests: write

concurrency:
  group: codex-review-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  request-review:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Comment on the verified PR
        uses: actions/github-script@v8
        env:
          REVIEW_PROMPT: |
            @codex review

            请按以下标准审查本 PR。先对照仓库现有实现、根目录 `AGENTS.md` 和相邻文件，再判断改动是否引入具体问题。测试通过后仍要检查代码设计。

            1. **现有风格与文件组织**。检查命名、注释和 C/C++ include 顺序是否遵循项目约定。公开接口应放在 `include/mini_infer/`，后端实现和内部声明应放在 `src/`。检查算子入口、CPU/CUDA 实现、反向节点、CMake 注册和测试文件的职责与引用是否一致。指出偏离现有组织后对构建、调用或维护造成的具体影响。
            2. **复用、RAII 与所有权**。查找已有的参数校验、布局遍历、内存分配、数据复制和版本检查入口。新增重复逻辑时，说明它与已有实现可能出现的行为差异。检查分配地址、文件句柄、CUDA 资源和 Tensor 视图的所有者。构造失败、异常返回、拷贝、`clone()`、设备迁移及原地写入后，资源释放和状态更新应保持一致。
            3. **可读性、扩展性与解耦**。沿“输入校验 → 输出准备 → 后端执行 → 反向传播”追踪数据流，指出难以判断的所有权转移、隐含副作用和复杂分支。检查新增依赖是否把 CUDA、分配器或 Autograd 细节带入无关模块。增加 dtype、设备或算子时，改动应尽量留在对应模块。建议抽取辅助函数、模板或分发层时，说明当前哪些重复代码会因此变得更清楚。

            每条发现都给出文件与行号、触发条件、实际后果和最小修改建议。优先报告会影响正确性、资源安全或长期维护的具体问题。纯粹的个人风格偏好不作为问题。没有可操作发现时，明确写出审查结果。
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const candidates = run.pull_requests?.length
              ? run.pull_requests
              : await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
                  owner,
                  repo,
                  commit_sha: run.head_sha,
                });
            const marker = '<!-- codex-review-request:' + run.head_sha + ' -->';

            for (const candidate of candidates) {
              const { data: pull } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: candidate.number,
              });
              if (pull.state !== 'open' || pull.head.sha !== run.head_sha) {
                continue;
              }

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pull.number,
              });
              if (comments.some(comment => comment.body?.includes(marker))) {
                continue;
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull.number,
                body: marker + '\n' + process.env.REVIEW_PROMPT,
              });
            }
